name: Stabilization Build (Unsigned)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional stabilization version label"
        required: false
        type: string
      publish_prerelease:
        description: "Publish the unsigned stabilization binaries as a GitHub pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            hive_binary: target/release/abigail-hive-app.exe
            runtime_binary: target/release/abigail-entity-runtime-app.exe
            hive_asset_name: Abigail-Hive-windows-x64.exe
            runtime_asset_name: Abigail-Entity-Runtime-windows-x64.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            hive_binary: target/release/abigail-hive-app
            runtime_binary: target/release/abigail-entity-runtime-app
            hive_asset_name: Abigail-Hive-linux-x64
            runtime_asset_name: Abigail-Entity-Runtime-linux-x64

    runs-on: ${{ matrix.platform }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            git fetch --tags
            LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [[ -z "$LATEST" ]]; then
              VERSION="0.0.1"
            else
              LATEST_VER="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VER"
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          TAG="v${VERSION}-stabilization.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: "."
          shared-key: stabilization-${{ matrix.platform }}

      - name: Verify unsigned stabilization lane
        run: node scripts/check_unsigned_stabilization.mjs

      - name: Build unsigned Hive and Runtime apps
        run: cargo build --release -p abigail-hive-app -p abigail-entity-runtime-app

      - name: Stage stabilization binaries
        shell: bash
        run: |
          mkdir -p stabilization-assets
          cp "${{ matrix.hive_binary }}" "stabilization-assets/${{ matrix.hive_asset_name }}"
          cp "${{ matrix.runtime_binary }}" "stabilization-assets/${{ matrix.runtime_asset_name }}"
          ls -la stabilization-assets

      - name: Upload stabilization artifacts
        uses: actions/upload-artifact@47309c993abb98030a35d55ef7ff34b7fa1074b5 # v4
        with:
          name: abigail-stabilization-${{ matrix.platform }}
          path: stabilization-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event.inputs.publish_prerelease == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download stabilization artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: abigail-stabilization-*
          merge-multiple: false

      - name: Count downloaded artifacts
        id: artifacts
        shell: bash
        run: |
          COUNT=$(find artifacts -type f | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create git tag if needed
        if: steps.artifacts.outputs.count != '0'
        shell: bash
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub pre-release
        if: steps.artifacts.outputs.count != '0'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Abigail Stabilization ${{ needs.build.outputs.version }}
          prerelease: true
          draft: false
          body: |
            Unsigned stabilization binaries for the split Abigail Hive and Abigail Entity Runtime apps.

            This lane intentionally excludes updater artifacts, installer migration logic, and release signing.
          files: |
            artifacts/**/*
