# Builds an unsigned "Abigail Preview" installer from the dispatched commit for
# UAT. Preview installs beside stable Abigail with its own app identities, data
# root, vault credential, and Hive ports, so testers keep their stable family
# data untouched. Uses only in-tree scripts and no signing or release secrets;
# it never publishes a release. This file is registered on main, so it can be
# dispatched for any branch, which then runs that branch's copy:
#   gh workflow run preview-candidate.yml --ref beta -f version=0.0.77
name: Abigail Preview Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version (major.minor.patch)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate version
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
        run: |
          if ($env:PREVIEW_VERSION -cnotmatch '^\d+\.\d+\.\d+$') { throw 'Preview version must be major.minor.patch.' }

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: |
            hive-app/src-ui/package-lock.json
            entity-runtime-app/src-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: preview-candidate

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version 2.10.1 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI installation failed.' }

      - name: Check preview packaging contract
        run: node --test scripts/tests/test_preview_channel_packaging.mjs

      - name: Build and verify unsigned preview installer
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
        run: ./scripts/build-mvp-windows.ps1 -Channel preview -Version $env:PREVIEW_VERSION -Configuration release -VerifyInstall

      - name: Upload preview installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-preview-${{ inputs.version }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/windows-preview/AbigailPreview-windows-x64-setup.exe
            dist/windows-preview/mvp-build.json
