# Build the one-step Abigail installer from the split Hive + Entity Runtime
# product. The installed user experience is one app icon: Abigail.

name: Abigail Installer Release

on:
  push:
    branches:
      - beta
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 0.0.75). Leave empty for auto-increment.'
        required: false
        type: string
      windows_signing:
        description: 'Use repository policy, unsigned stabilization, or SSL.com cloud signing.'
        required: false
        default: repository
        type: choice
        options:
          - repository
          - unsigned
          - esigner
      publish_release:
        description: 'Publish a beta/stable release after verification. Disable for a candidate artifact build.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# One certificate's OTP and cloud signing requests must remain serial.
# Preserve queued beta pushes instead of replacing the single pending run.
concurrency:
  group: abigail-windows-release-signing
  queue: max
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 120
    env:
      ABIGAIL_CLOUD_SIGNING: ${{ inputs.windows_signing == 'esigner' || (inputs.windows_signing != 'unsigned' && vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true' && vars.ABIGAIL_WINDOWS_SIGNING_MODE == 'esigner') }}
      ABIGAIL_LOCAL_SIGNING: ${{ inputs.windows_signing != 'unsigned' && inputs.windows_signing != 'esigner' && vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true' && vars.ABIGAIL_WINDOWS_SIGNING_MODE != 'esigner' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            installer_path: target/release/bundle/nsis/*.exe
            msi_path: target/release/bundle/msi/*.msi

    runs-on: ${{ vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true' && inputs.windows_signing != 'unsigned' && inputs.windows_signing != 'esigner' && vars.ABIGAIL_WINDOWS_SIGNING_MODE != 'esigner' && vars.ABIGAIL_WINDOWS_RUNNER != '' && vars.ABIGAIL_WINDOWS_RUNNER || matrix.platform }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_name: ${{ steps.version.outputs.release_name }}
      windows_signed: ${{ env.ABIGAIL_LOCAL_SIGNING == 'true' || env.ABIGAIL_CLOUD_SIGNING == 'true' }}
      updater_signed: ${{ env.ABIGAIL_CLOUD_SIGNING != 'true' && inputs.windows_signing != 'unsigned' && vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate cloud signing credentials before building
        if: env.ABIGAIL_CLOUD_SIGNING == 'true'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $required = @('ESIGNER_USERNAME', 'ESIGNER_PASSWORD', 'ESIGNER_CREDENTIAL_ID', 'ESIGNER_TOTP_SECRET', 'WINDOWS_CERTIFICATE_THUMBPRINT')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count) { throw "Missing encrypted signing secrets: $($missing -join ', '). Configure repository Actions secrets before retrying." }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') { throw 'WINDOWS_CERTIFICATE_THUMBPRINT must be the certificate SHA-1 thumbprint, not the eSigner credential ID.' }
          if ($env:ESIGNER_TOTP_SECRET.Trim() -match '^\d{6}$') { throw 'ESIGNER_TOTP_SECRET must be the persistent certificate signing seed, not a changing six-digit code.' }

      - name: Validate release publication branch
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -notin @('refs/heads/beta', 'refs/heads/main') -and $env:RELEASE_REF -notmatch '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[0-9]+)?$') {
            throw 'Publish from beta/main or an existing release tag. Use publish_release=false for a candidate branch build.'
          }

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Locate Windows SDK signing tools
        if: env.ABIGAIL_LOCAL_SIGNING == 'true' || env.ABIGAIL_CLOUD_SIGNING == 'true'
        shell: pwsh
        run: |
          . ./scripts/windows_signing_common.ps1
          $signTool = Resolve-WindowsSignToolPath
          Split-Path $signTool -Parent | Out-File -Append -FilePath $env:GITHUB_PATH
          "TAURI_WINDOWS_SIGNTOOL_PATH=$signTool" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            hive-app/src-ui/package-lock.json
            entity-runtime-app/src-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          IS_BETA="false"
          if [[ "${{ github.ref }}" == "refs/heads/beta" || "${{ github.ref_name }}" == *"-beta."* ]]; then
            IS_BETA="true"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            RAW_VERSION="${RAW_VERSION#v}"
            VERSION="${RAW_VERSION%%-*}"
            TAG="${{ github.ref_name }}"
          elif [[ -n "$REQUESTED_RELEASE_VERSION" ]]; then
            VERSION="$REQUESTED_RELEASE_VERSION"
          else
            git fetch --tags
            LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [[ -z "$LATEST" ]]; then
              VERSION="0.0.1"
            else
              LATEST_VER="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VER"
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be a numeric major.minor.patch value."
            exit 1
          fi

          if [[ -z "${TAG:-}" ]]; then
            if [[ "$IS_BETA" == "true" ]]; then
              TAG="v${VERSION}-beta.${{ github.run_number }}"
            else
              TAG="v${VERSION}"
            fi
          fi

          if [[ "$TAG" == *"-beta."* ]]; then
            IS_BETA="true"
          fi

          if [[ "$IS_BETA" == "true" ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
            RELEASE_NAME="Abigail ${TAG} (Beta UAT)"
          else
            CHANNEL="stable"
            PRERELEASE="false"
            RELEASE_NAME="Abigail ${TAG}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Abigail installer version: $VERSION (tag: $TAG, channel: $CHANNEL)"

      - name: Update Hive app version
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'hive-app/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Disable beforeBuildCommand for CI
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'hive-app/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.build = conf.build || {};
            conf.build.beforeBuildCommand = '';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Enforce release signing prerequisites
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: bash
        env:
          ABIGAIL_OFFICIAL_RELEASE: "true"
          ABIGAIL_REQUIRE_UPDATER_SIGNING: ${{ inputs.windows_signing != 'unsigned' && vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true' }}
          ABIGAIL_REQUIRE_WINDOWS_SIGNING: ${{ env.ABIGAIL_LOCAL_SIGNING }}
          ABIGAIL_WINDOWS_SIGNING_MODE: ${{ env.ABIGAIL_LOCAL_SIGNING == 'true' && vars.ABIGAIL_WINDOWS_SIGNING_MODE || 'off' }}
          ABIGAIL_WINDOWS_RUNNER: ${{ vars.ABIGAIL_WINDOWS_RUNNER }}
          ABIGAIL_REQUIRE_MAC_SIGNING: "false"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_CERT_PEM: ${{ secrets.WINDOWS_SIGNING_CERT_PEM }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: bash scripts/enforce_release_prereqs.sh

      - name: Configure updater and signing fields
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: bash
        env:
          ABIGAIL_REQUIRE_UPDATER_PUBKEY: ${{ inputs.windows_signing != 'unsigned' && vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true' }}
          ABIGAIL_ENABLE_UPDATER_ARTIFACTS: ${{ inputs.windows_signing != 'unsigned' && vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true' }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ env.ABIGAIL_LOCAL_SIGNING == 'true' && secrets.WINDOWS_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ env.ABIGAIL_LOCAL_SIGNING == 'true' && secrets.WINDOWS_TIMESTAMP_URL || '' }}
          WINDOWS_TIMESTAMP_TSP: ${{ env.ABIGAIL_LOCAL_SIGNING == 'true' && vars.ABIGAIL_WINDOWS_TIMESTAMP_TSP || '' }}
        run: node scripts/prepare_tauri_bundle_config.mjs hive-app/tauri.conf.json

      - name: Prepare Windows signing certificate and verified signing command
        if: env.ABIGAIL_LOCAL_SIGNING == 'true'
        shell: pwsh
        env:
          ABIGAIL_WINDOWS_SIGNING_MODE: ${{ vars.ABIGAIL_WINDOWS_SIGNING_MODE }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_CERT_PEM: ${{ secrets.WINDOWS_SIGNING_CERT_PEM }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./scripts/windows_signing_preflight.ps1
          . ./scripts/windows_signing_common.ps1
          Set-WindowsSigningCommand -ConfigPath (Resolve-Path 'hive-app/tauri.conf.json').Path `
            -Thumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT -TimestampUrl $env:WINDOWS_TIMESTAMP_URL -NoNotice

      - name: Validate Cargo.lock
        shell: bash
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: "."
          shared-key: installer-${{ matrix.platform }}

      - name: Stage split installer resources
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: pwsh
        run: ./scripts/stage_split_installer_resources.ps1 -Configuration release

      - name: Verify split installer payload
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: pwsh
        run: |
          $required = @(
            "hive-app/resources/abigail-entity-runtime-app.exe",
            "hive-app/resources/hive-daemon.exe",
            "hive-app/resources/entity-daemon.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing installer payload file: $path"
            }
          }

      - name: Sign internal Windows executables before packaging
        if: env.ABIGAIL_LOCAL_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          . ./scripts/windows_signing_common.ps1
          $files = @(
            'hive-app/resources/abigail-entity-runtime-app.exe',
            'hive-app/resources/hive-daemon.exe',
            'hive-app/resources/entity-daemon.exe'
          )
          ./scripts/windows_interactive_sign.ps1 -SignToolPath (Resolve-WindowsSignToolPath) `
            -CertificateThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT `
            -TimestampUrl $env:WINDOWS_TIMESTAMP_URL -NoNotice -Files $files

      - name: Verify packaged frontend assets
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: bash
        run: |
          for app in hive-app entity-runtime-app; do
            if [[ ! -f "$app/src-ui/dist/video/startup.mp4" ]]; then
              echo "$app is missing dist/video/startup.mp4"
              exit 1
            fi
            if grep -E 'rel="stylesheet"|href="./assets/.*\.css|href="/assets/.*\.css' "$app/src-ui/dist/index.html"; then
              echo "$app frontend still depends on an external stylesheet in packaged index.html"
              exit 1
            fi
            if grep -E 'src="/assets|href="/assets|src="/video|href="/video' "$app/src-ui/dist/index.html"; then
              echo "$app frontend emitted absolute packaged asset paths"
              exit 1
            fi
            if ! grep -R --include '*.js' -F "data-abigail-app-css" "$app/src-ui/dist/assets" >/dev/null; then
              echo "$app frontend bundle does not install inline Abigail CSS"
              exit 1
            fi
            if ! grep -R --include '*.js' -F -- "--color-primary" "$app/src-ui/dist/assets" >/dev/null; then
              echo "$app frontend bundle is missing Abigail theme CSS"
              exit 1
            fi
          done

      - name: Configure split installer resources
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'hive-app/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.bundle = conf.bundle || {};
            conf.mainBinaryName = 'Abigail';
            conf.bundle.resources = [
              'resources/abigail-entity-runtime-app.exe',
              'resources/hive-daemon.exe',
              'resources/entity-daemon.exe'
            ];
            conf.bundle.windows = conf.bundle.windows || {};
            conf.bundle.windows.nsis = conf.bundle.windows.nsis || {};
            conf.bundle.windows.nsis.installerHooks = '../scripts/nsis-mvp-hooks.nsh';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.11.4

      - name: Install pinned SSL.com CodeSignTool
        if: env.ABIGAIL_CLOUD_SIGNING == 'true'
        shell: pwsh
        run: ./scripts/install_esigner.ps1

      - name: Verify cloud signing regression checks
        if: env.ABIGAIL_CLOUD_SIGNING == 'true'
        shell: pwsh
        run: |
          ./scripts/test_esigner_cloud.ps1
          ./scripts/tests/test_signed_installer_state.ps1

      - name: Verify SSL.com account access and intended certificate
        if: env.ABIGAIL_CLOUD_SIGNING == 'true'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: ./scripts/check_esigner_credentials.ps1

      - name: Prepare full cloud installer without signing secrets
        if: env.ABIGAIL_CLOUD_SIGNING == 'true'
        shell: pwsh
        env:
          SIGNED_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CARGO_BUILD_JOBS: '3'
        run: |
          ./scripts/build_signed_installer.ps1 -Phase Prepare -Version $env:SIGNED_RELEASE_VERSION
          ./scripts/build_signed_installer.ps1 -Phase Check -Version $env:SIGNED_RELEASE_VERSION

      - name: Cloud sign and verify installed full Abigail product
        id: cloud_sign
        if: env.ABIGAIL_CLOUD_SIGNING == 'true'
        shell: pwsh
        env:
          SIGNED_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          ./scripts/build_signed_installer.ps1 -Phase Sign -Version $env:SIGNED_RELEASE_VERSION

      - name: Collect selected cloud installer validation evidence
        if: always() && env.ABIGAIL_CLOUD_SIGNING == 'true' && steps.cloud_sign.outputs.artifact_dir != ''
        shell: pwsh
        env:
          ABIGAIL_VALIDATION_ARTIFACT_DIR: ${{ steps.cloud_sign.outputs.artifact_dir }}
        run: |
          $artifactDir = [IO.Path]::GetFullPath($env:ABIGAIL_VALIDATION_ARTIFACT_DIR)
          $releaseRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'target/signed-release')).TrimEnd('\') + '\'
          if (-not $artifactDir.StartsWith($releaseRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Cloud validation evidence must belong to this checkout release directory.'
          }
          New-Item -ItemType Directory -Force artifacts/installer-validation | Out-Null
          $signature = Join-Path $artifactDir 'windows-signatures.json'
          if (Test-Path -LiteralPath $signature -PathType Leaf) {
            $signatureFile = Get-Item -LiteralPath $signature
            if ($signatureFile.Attributes -band [IO.FileAttributes]::ReparsePoint -or $signatureFile.Length -gt 2MB) { throw 'Signature evidence must be a bounded regular file.' }
            Copy-Item -LiteralPath $signature -Destination artifacts/windows-signatures.json
          }
          $validationRoot = Join-Path $artifactDir 'validation'
          $reports = @('mvp-build.json', 'installed-payload.json', 'windows-signatures-pre-contract.json', 'diagnostic-export.json', 'failure.json')
          $bytes = 0
          $count = 0
          foreach ($file in @(Get-ChildItem -LiteralPath $validationRoot -File -Recurse)) {
            $relative = [IO.Path]::GetRelativePath($validationRoot, $file.FullName).Replace('\', '/')
            $allowed = $relative -in $reports -or $relative -eq 'contract/latest.json' -or
              $relative -match '^contract/[0-9TZ-]+-[0-9a-f]{8}/(result\.json|timeline\.jsonl|hive-\d+\.(stdout|stderr)\.txt|logs/[A-Za-z0-9._-]+\.(log|txt))$'
            if (-not $allowed) { continue }
            $current = $file.FullName
            while ($current.Length -ge $validationRoot.Length) {
              if ((Get-Item -LiteralPath $current -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Validation evidence cannot traverse links.' }
              if ($current -eq $validationRoot) { break }
              $current = [IO.Path]::GetDirectoryName($current)
            }
            if ($file.Length -gt 2MB -or $count -ge 72 -or $bytes + $file.Length -gt 32MB) {
              throw 'Selected validation evidence exceeds its upload bounds.'
            }
            $destination = Join-Path 'artifacts/installer-validation' $relative
            New-Item -ItemType Directory -Force -Path ([IO.Path]::GetDirectoryName($destination)) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $destination
            $bytes += $file.Length
            $count++
          }

      - name: Build Abigail installer
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: bash
        env:
          ABIGAIL_SIGNED_MAIN_PATH: ${{ env.ABIGAIL_LOCAL_SIGNING == 'true' && format('{0}/artifacts/signed-main/Abigail.exe', github.workspace) || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd hive-app
          tauri build

      - name: Verify Windows signatures before uploading release assets
        if: env.ABIGAIL_LOCAL_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $nsis = @(Get-ChildItem target/release/bundle/nsis -File -Filter '*.exe')
          $msi = @(Get-ChildItem target/release/bundle/msi -File -Filter '*.msi')
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw 'Expected exactly one NSIS and one MSI installer for signature verification.'
          }
          $files = @(
            'artifacts/signed-main/Abigail.exe',
            'hive-app/resources/abigail-entity-runtime-app.exe',
            'hive-app/resources/hive-daemon.exe',
            'hive-app/resources/entity-daemon.exe'
          ) + @($nsis.FullName) + @($msi.FullName)
          ./scripts/verify_windows_signatures.ps1 -Files $files -ReportPath artifacts/windows-signatures.json

      - name: Verify installed unsigned payload and synthetic contract
        if: env.ABIGAIL_LOCAL_SIGNING != 'true' && env.ABIGAIL_CLOUD_SIGNING != 'true'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one unsigned NSIS installer.' }
          $recipe = Get-Content -LiteralPath target/release/nsis/x64/installer.nsi -Raw
          $mainName = [regex]::Match($recipe, '(?m)^!define MAINBINARYNAME "([^"]+)"').Groups[1].Value
          $mainSource = [regex]::Match($recipe, '(?m)^!define MAINBINARYSRCPATH "([^"]+)"').Groups[1].Value
          if (-not $mainName -or -not $mainSource) { throw 'NSIS recipe does not identify its launcher.' }
          $bytes = [IO.File]::ReadAllBytes($mainSource)
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          $marker = '__TAURI_BUNDLE_TYPE_VAR_UNK'
          $offset = $text.IndexOf($marker, [StringComparison]::Ordinal)
          if ($offset -lt 0 -or $text.IndexOf($marker, $offset + $marker.Length, [StringComparison]::Ordinal) -ge 0) {
            throw 'Launcher must contain exactly one original Tauri bundle marker.'
          }
          [Array]::Copy([Text.Encoding]::ASCII.GetBytes('NSS'), 0, $bytes, $offset + $marker.Length - 3, 3)
          $hasher = [Security.Cryptography.SHA256]::Create()
          try { $launcherHash = [BitConverter]::ToString($hasher.ComputeHash($bytes)).Replace('-', '') }
          finally { $hasher.Dispose() }
          $payload = @([ordered]@{ relative_path = "$mainName.exe"; sha256 = $launcherHash })
          foreach ($binary in @('abigail-entity-runtime-app.exe', 'hive-daemon.exe', 'entity-daemon.exe')) {
            $payload += [ordered]@{
              relative_path = "resources/$binary"
              sha256 = (Get-FileHash -LiteralPath "hive-app/resources/$binary" -Algorithm SHA256).Hash
            }
          }
          New-Item -ItemType Directory -Force artifacts/installer-validation | Out-Null
          $manifestPath = 'artifacts/installer-validation/mvp-build.json'
          $manifest = [ordered]@{
            version = '${{ steps.version.outputs.version }}'
            installer_sha256 = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash
            payload = $payload
          }
          [IO.File]::WriteAllText((Join-Path $PWD $manifestPath), ($manifest | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          $installDir = Join-Path $PWD 'target/manual-test/release-installed-${{ github.run_id }}-${{ github.run_attempt }}'
          ./scripts/verify-mvp-windows.ps1 -InstallerPath $installers[0].FullName -ManifestPath $manifestPath -InstallDir $installDir
          Copy-Item -LiteralPath "$installDir-verification/installed-payload.json" -Destination artifacts/installer-validation/installed-payload.json
          ./scripts/tests/run-mvp-acceptance.ps1 -BinaryDir $installDir -OutputDir artifacts/installer-validation/contract

      - name: Upload unsigned installer validation evidence
        if: always() && env.ABIGAIL_LOCAL_SIGNING != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-installer-validation-windows-latest
          path: artifacts/installer-validation
          if-no-files-found: warn

      - name: Upload Windows signature evidence
        if: always() && (env.ABIGAIL_LOCAL_SIGNING == 'true' || env.ABIGAIL_CLOUD_SIGNING == 'true') && hashFiles('artifacts/windows-signatures.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-signatures-windows-latest
          path: artifacts/windows-signatures.json
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-installer-${{ matrix.platform }}
          path: ${{ matrix.installer_path }}
          if-no-files-found: error

      - name: Upload MSI installer
        if: env.ABIGAIL_CLOUD_SIGNING != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-msi-${{ matrix.platform }}
          path: ${{ matrix.msi_path }}
          if-no-files-found: warn

      - name: Upload updater artifacts
        if: env.ABIGAIL_CLOUD_SIGNING != 'true' && inputs.windows_signing != 'unsigned' && vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-updater-${{ matrix.platform }}
          path: |
            target/**/bundle/**/*.nsis.zip
            target/**/bundle/**/*.nsis.zip.sig
            target/**/bundle/**/*.msi.zip
            target/**/bundle/**/*.msi.zip.sig
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: abigail-*
          merge-multiple: false

      - name: Require successful CI gate for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          BRANCH=main
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then BRANCH=beta; fi
          DEADLINE=$((SECONDS + 3600))
          while (( SECONDS < DEADLINE )); do
            RUN_ID=$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --branch "$BRANCH" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$RUN_ID" ]]; then
              GATE=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "gate" and .status == "completed") | .conclusion' | head -1)
              if [[ "$GATE" == "success" ]]; then
                echo "CI gate passed for $RELEASE_SHA on $BRANCH (run $RUN_ID)."
                exit 0
              elif [[ -n "$GATE" ]]; then
                echo "::error::CI gate failed for $RELEASE_SHA on $BRANCH: $GATE"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for same-commit CI gate on $BRANCH."
          exit 1

      - name: Create git tag if needed
        shell: bash
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            if [[ "$TAG_SHA" != "${{ github.sha }}" ]]; then
              echo "::error::Tag $TAG belongs to $TAG_SHA, not release commit ${{ github.sha }}."
              exit 1
            fi
            echo "Tag $TAG already identifies the release commit."
          else
            git tag "$TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi

      - name: Rename release assets
        shell: bash
        run: |
          mkdir -p release-assets

          INSTALLER=$(find artifacts/abigail-installer-windows-latest -name "*.exe" -type f 2>/dev/null | head -1 || true)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: No Windows installer found in artifacts"
            exit 1
          fi
          cp "$INSTALLER" release-assets/Abigail-windows-x64-setup.exe

          MSI=$(find artifacts/abigail-msi-windows-latest -name "*.msi" -type f 2>/dev/null | head -1 || true)
          if [ -n "$MSI" ]; then
            cp "$MSI" release-assets/Abigail-windows-x64.msi
          fi

          if [[ "${{ needs.build.outputs.windows_signed }}" == "true" ]]; then
            cp artifacts/abigail-signatures-windows-latest/windows-signatures.json release-assets/windows-signatures.json
          fi

          if [[ "${{ needs.build.outputs.updater_signed }}" == "true" ]]; then
            find artifacts/abigail-updater-windows-latest -type f -name "*.zip*" -exec cp {} release-assets/ \;
            node scripts/generate_tauri_latest_manifest.mjs \
              --version "${{ needs.build.outputs.version }}" \
              --assets-dir release-assets \
              --base-url "https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag }}" \
              --output release-assets/latest.json
          fi

          ls -la release-assets

      - name: Count release assets
        id: assets
        shell: bash
        run: |
          COUNT=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          test "$COUNT" != "0"

      - name: Create GitHub Release
        if: steps.assets.outputs.count != '0'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.release_name }}
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease }}
          body: |
            ## ${{ needs.build.outputs.release_name }}

            Release channel: `${{ needs.build.outputs.channel }}`

            Windows Authenticode signatures verified: `${{ needs.build.outputs.windows_signed }}`.

            ### Installation

            Download and run the Windows installer:
            - **Windows**: `Abigail-windows-x64-setup.exe`
            - **Windows (MSI)**: `Abigail-windows-x64.msi` when included. The SSL.com cloud lane produces the full `.exe` installer.

            Abigail installs as one app icon. Launch **Abigail** to open Abigail Hive; the bundled Hive daemon, Entity Runtime, and Entity daemons start as needed in the background.

            ### Beta UAT

            Builds from the permanent `beta` branch are tagged as `vX.Y.Z-beta.N` and published as prereleases for UAT. Promote validated beta changes to `main` for a stable `vX.Y.Z` release.

            ### Platform Notes

            - macOS builds remain temporarily unavailable while Apple signing is paused.
            - Linux one-step packaging is planned after the Windows installer lane is stable.
          files: release-assets/*

  verify-beta-installer:
    needs: [build, publish]
    if: needs.build.outputs.channel == 'beta'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Install archive tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download published beta installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          gh release download "${{ needs.build.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "Abigail-windows-x64-setup.exe" \
            --dir downloaded

      - name: Verify bundled internal binaries
        shell: bash
        run: |
          INSTALLER="downloaded/Abigail-windows-x64-setup.exe"
          test -f "$INSTALLER"
          7z l "$INSTALLER" > installer-contents.txt
          for binary in \
            "abigail-entity-runtime-app.exe" \
            "hive-daemon.exe" \
            "entity-daemon.exe"
          do
            if ! grep -E "resources[\\\\/]$binary" installer-contents.txt >/dev/null; then
              echo "Missing bundled internal binary at installer resource path: resources/$binary"
              exit 1
            fi
          done

      - name: Record beta UAT installer metadata
        shell: bash
        run: |
          mkdir -p uat-release
          node -e "
            const fs = require('fs');
            fs.writeFileSync('uat-release/beta-installer.json', JSON.stringify({
              tag: '${{ needs.build.outputs.tag }}',
              version: '${{ needs.build.outputs.version }}',
              installer: 'Abigail-windows-x64-setup.exe',
              channel: 'beta',
              prerelease: true,
              workflow_run_id: '${{ github.run_id }}',
              repository: '${{ github.repository }}'
            }, null, 2) + '\n');
          "
          cp installer-contents.txt uat-release/installer-contents.txt

      - name: Upload beta UAT verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: beta-uat-installer-verification
          path: uat-release/*
          if-no-files-found: error
