# Build the one-step Abigail installer from the split Hive + Entity Runtime
# product. The installed user experience is one app icon: Abigail.

name: Abigail Installer Release

on:
  push:
    branches:
      - beta
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 0.0.75). Leave empty for auto-increment.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            installer_path: target/release/bundle/nsis/*.exe
            msi_path: target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform == 'windows-latest' && vars.ABIGAIL_WINDOWS_RUNNER != '' && vars.ABIGAIL_WINDOWS_RUNNER || matrix.platform }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Install Windows SDK signing tools
        if: vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          choco install windows-sdk-10-version-2004-windbg --no-progress -y
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Sort-Object { [version]($_.FullName -replace '.*\\(\d+\.\d+\.\d+\.\d+)\\.*', '$1') } -Descending |
            Select-Object -First 1
          if ($signtool) {
            Write-Host "Found signtool at: $($signtool.FullName)"
            echo ($signtool.DirectoryName) | Out-File -Append -FilePath $env:GITHUB_PATH
          } else {
            Write-Error "signtool.exe not found after SDK install"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            hive-app/src-ui/package-lock.json
            entity-runtime-app/src-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          IS_BETA="false"
          if [[ "${{ github.ref }}" == "refs/heads/beta" || "${{ github.ref_name }}" == *"-beta."* ]]; then
            IS_BETA="true"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            RAW_VERSION="${RAW_VERSION#v}"
            VERSION="${RAW_VERSION%%-*}"
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            git fetch --tags
            LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [[ -z "$LATEST" ]]; then
              VERSION="0.0.1"
            else
              LATEST_VER="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VER"
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if [[ -z "${TAG:-}" ]]; then
            if [[ "$IS_BETA" == "true" ]]; then
              TAG="v${VERSION}-beta.${{ github.run_number }}"
            else
              TAG="v${VERSION}"
            fi
          fi

          if [[ "$TAG" == *"-beta."* ]]; then
            IS_BETA="true"
          fi

          if [[ "$IS_BETA" == "true" ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
            RELEASE_NAME="Abigail ${TAG} (Beta UAT)"
          else
            CHANNEL="stable"
            PRERELEASE="false"
            RELEASE_NAME="Abigail ${TAG}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Abigail installer version: $VERSION (tag: $TAG, channel: $CHANNEL)"

      - name: Update Hive app version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'hive-app/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Disable beforeBuildCommand for CI
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'hive-app/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.build = conf.build || {};
            conf.build.beforeBuildCommand = '';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Enforce release signing prerequisites
        shell: bash
        env:
          ABIGAIL_OFFICIAL_RELEASE: "true"
          ABIGAIL_REQUIRE_UPDATER_SIGNING: ${{ vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true' }}
          ABIGAIL_REQUIRE_WINDOWS_SIGNING: ${{ vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true' }}
          ABIGAIL_WINDOWS_SIGNING_MODE: ${{ vars.ABIGAIL_WINDOWS_SIGNING_MODE }}
          ABIGAIL_WINDOWS_RUNNER: ${{ vars.ABIGAIL_WINDOWS_RUNNER }}
          ABIGAIL_REQUIRE_MAC_SIGNING: "false"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_CERT_PEM: ${{ secrets.WINDOWS_SIGNING_CERT_PEM }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: bash scripts/enforce_release_prereqs.sh

      - name: Configure updater and signing fields
        shell: bash
        env:
          ABIGAIL_REQUIRE_UPDATER_PUBKEY: ${{ vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true' }}
          ABIGAIL_ENABLE_UPDATER_ARTIFACTS: ${{ vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true' }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true' && secrets.WINDOWS_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true' && secrets.WINDOWS_TIMESTAMP_URL || '' }}
          WINDOWS_TIMESTAMP_TSP: ${{ vars.ABIGAIL_REQUIRE_WINDOWS_SIGNING == 'true' && vars.ABIGAIL_WINDOWS_TIMESTAMP_TSP || '' }}
        run: node scripts/prepare_tauri_bundle_config.mjs hive-app/tauri.conf.json

      - name: Validate Cargo.lock
        shell: bash
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: "."
          shared-key: installer-${{ matrix.platform }}

      - name: Stage split installer resources
        shell: pwsh
        run: ./scripts/stage_split_installer_resources.ps1 -Configuration release

      - name: Verify split installer payload
        shell: pwsh
        run: |
          $required = @(
            "hive-app/resources/abigail-entity-runtime-app.exe",
            "hive-app/resources/hive-daemon.exe",
            "hive-app/resources/entity-daemon.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing installer payload file: $path"
            }
          }

      - name: Verify packaged frontend assets
        shell: bash
        run: |
          for app in hive-app entity-runtime-app; do
            if [[ ! -f "$app/src-ui/dist/video/startup.mp4" ]]; then
              echo "$app is missing dist/video/startup.mp4"
              exit 1
            fi
            if grep -E 'rel="stylesheet"|href="./assets/.*\.css|href="/assets/.*\.css' "$app/src-ui/dist/index.html"; then
              echo "$app frontend still depends on an external stylesheet in packaged index.html"
              exit 1
            fi
            if grep -E 'src="/assets|href="/assets|src="/video|href="/video' "$app/src-ui/dist/index.html"; then
              echo "$app frontend emitted absolute packaged asset paths"
              exit 1
            fi
            if ! grep -R --include '*.js' -F "data-abigail-app-css" "$app/src-ui/dist/assets" >/dev/null; then
              echo "$app frontend bundle does not install inline Abigail CSS"
              exit 1
            fi
            if ! grep -R --include '*.js' -F -- "--color-primary" "$app/src-ui/dist/assets" >/dev/null; then
              echo "$app frontend bundle is missing Abigail theme CSS"
              exit 1
            fi
          done

      - name: Configure split installer resources
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'hive-app/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.bundle = conf.bundle || {};
            conf.bundle.resources = [
              'resources/abigail-entity-runtime-app.exe',
              'resources/hive-daemon.exe',
              'resources/entity-daemon.exe'
            ];
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@v2

      - name: Build Abigail installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd hive-app
          tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-installer-${{ matrix.platform }}
          path: ${{ matrix.installer_path }}
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-msi-${{ matrix.platform }}
          path: ${{ matrix.msi_path }}
          if-no-files-found: warn

      - name: Upload updater artifacts
        if: vars.ABIGAIL_REQUIRE_UPDATER_SIGNING == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: abigail-updater-${{ matrix.platform }}
          path: |
            target/**/bundle/**/*.nsis.zip
            target/**/bundle/**/*.nsis.zip.sig
            target/**/bundle/**/*.msi.zip
            target/**/bundle/**/*.msi.zip.sig
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: abigail-*
          merge-multiple: false

      - name: Create git tag if needed
        shell: bash
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Rename release assets
        shell: bash
        run: |
          mkdir -p release-assets

          INSTALLER=$(find artifacts/abigail-installer-windows-latest -name "*.exe" -type f 2>/dev/null | head -1 || true)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: No Windows installer found in artifacts"
            exit 1
          fi
          cp "$INSTALLER" release-assets/Abigail-windows-x64-setup.exe

          MSI=$(find artifacts/abigail-msi-windows-latest -name "*.msi" -type f 2>/dev/null | head -1 || true)
          if [ -n "$MSI" ]; then
            cp "$MSI" release-assets/Abigail-windows-x64.msi
          fi

          if [[ "${{ vars.ABIGAIL_REQUIRE_UPDATER_SIGNING }}" == "true" ]]; then
            find artifacts/abigail-updater-windows-latest -type f -name "*.zip*" -exec cp {} release-assets/ \;
            node scripts/generate_tauri_latest_manifest.mjs \
              --version "${{ needs.build.outputs.version }}" \
              --assets-dir release-assets \
              --base-url "https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag }}" \
              --output release-assets/latest.json
          fi

          ls -la release-assets

      - name: Count release assets
        id: assets
        shell: bash
        run: |
          COUNT=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          test "$COUNT" != "0"

      - name: Create GitHub Release
        if: steps.assets.outputs.count != '0'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.release_name }}
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease }}
          body: |
            ## ${{ needs.build.outputs.release_name }}

            Release channel: `${{ needs.build.outputs.channel }}`

            ### Installation

            Download and run the Windows installer:
            - **Windows**: `Abigail-windows-x64-setup.exe`
            - **Windows (MSI)**: `Abigail-windows-x64.msi`

            Abigail installs as one app icon. Launch **Abigail** to open Abigail Hive; the bundled Hive daemon, Entity Runtime, and Entity daemons start as needed in the background.

            ### Beta UAT

            Builds from the permanent `beta` branch are tagged as `vX.Y.Z-beta.N` and published as prereleases for UAT. Promote validated beta changes to `main` for a stable `vX.Y.Z` release.

            ### Platform Notes

            - macOS builds remain temporarily unavailable while Apple signing is paused.
            - Linux one-step packaging is planned after the Windows installer lane is stable.
          files: release-assets/*

  verify-beta-installer:
    needs: [build, publish]
    if: needs.build.outputs.channel == 'beta'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Install archive tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download published beta installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          gh release download "${{ needs.build.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "Abigail-windows-x64-setup.exe" \
            --dir downloaded

      - name: Verify bundled internal binaries
        shell: bash
        run: |
          INSTALLER="downloaded/Abigail-windows-x64-setup.exe"
          test -f "$INSTALLER"
          7z l "$INSTALLER" > installer-contents.txt
          for binary in \
            "abigail-entity-runtime-app.exe" \
            "hive-daemon.exe" \
            "entity-daemon.exe"
          do
            if ! grep -E "resources[\\\\/]$binary" installer-contents.txt >/dev/null; then
              echo "Missing bundled internal binary at installer resource path: resources/$binary"
              exit 1
            fi
          done

      - name: Record beta UAT installer metadata
        shell: bash
        run: |
          mkdir -p uat-release
          node -e "
            const fs = require('fs');
            fs.writeFileSync('uat-release/beta-installer.json', JSON.stringify({
              tag: '${{ needs.build.outputs.tag }}',
              version: '${{ needs.build.outputs.version }}',
              installer: 'Abigail-windows-x64-setup.exe',
              channel: 'beta',
              prerelease: true,
              workflow_run_id: '${{ github.run_id }}',
              repository: '${{ github.repository }}'
            }, null, 2) + '\n');
          "
          cp installer-contents.txt uat-release/installer-contents.txt

      - name: Upload beta UAT verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: beta-uat-installer-verification
          path: uat-release/*
          if-no-files-found: error
