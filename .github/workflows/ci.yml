# Unified CI quality gate.
#
# Runs 5 parallel jobs on push to main and PRs. CodeQL also runs weekly.
# The "gate" job requires lint, test, and frontend to pass; audit and CodeQL
# are advisory. Configure branch protection to require the "gate" check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 0'  # Weekly on Sunday at 04:17 UTC (CodeQL)

permissions:
  contents: read

env:
  ABIGAIL_CI_MODE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  stability:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            hive-app/src-ui/package-lock.json
            entity-runtime-app/src-ui/package-lock.json

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      - name: Install split frontend dependencies
        shell: bash
        run: |
          cd hive-app/src-ui && npm ci
          cd ../../entity-runtime-app/src-ui && npm ci

      - name: Verify unsigned stabilization lane
        run: node scripts/check_unsigned_stabilization.mjs

      - name: Check Hive and Runtime apps
        run: cargo check -p abigail-hive-app -p abigail-entity-runtime-app

      - name: Run Hive daemon contract tests
        run: cargo test -p hive-daemon --test integration
        env:
          ABIGAIL_DAEMON_INTEGRATION: "1"

      - name: Build daemon binaries for integration tests
        run: cargo build -p hive-daemon -p entity-daemon

      - name: Run Entity runtime contract tests
        run: cargo test -p entity-daemon --test integration
        env:
          ABIGAIL_DAEMON_INTEGRATION: "1"

      - name: Run stability gates
        run: node scripts/check_stability.mjs

  # -- Lint ----------------------------------------------------------------
  # Checks formatting, clippy, and split desktop app compilation.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude abigail-app -- -D warnings

      - name: Check split desktop apps compile
        run: cargo check -p abigail-hive-app -p abigail-entity-runtime-app

      - name: Test release signing key validator script
        shell: bash
        run: bash scripts/test_validate_tauri_signing_key.sh

  # -- Tests (3-platform matrix) ----------------------------------------------
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies (Tauri 2 / Debian)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      - name: Install cargo-llvm-cov (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo llvm-cov --workspace --exclude abigail-app --lcov --output-path lcov.info

      - name: Run tests (non-ubuntu)
        if: matrix.platform != 'ubuntu-22.04'
        run: cargo test --workspace --exclude abigail-app

      - name: Upload Rust coverage to Codecov
        if: matrix.platform == 'ubuntu-22.04'
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

  # -- Frontend build --------------------------------------------------------
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            hive-app/src-ui/package-lock.json
            entity-runtime-app/src-ui/package-lock.json

      - name: Install split frontend dependencies
        shell: bash
        run: |
          cd hive-app/src-ui && npm ci
          cd ../../entity-runtime-app/src-ui && npm ci

      - name: Build split frontends
        shell: bash
        run: |
          cd hive-app/src-ui && npm run build
          cd ../../entity-runtime-app/src-ui && npm run build

      - name: Run split frontend tests
        shell: bash
        run: |
          cd hive-app/src-ui && npm test
          cd ../../entity-runtime-app/src-ui && npm test

  # -- Security audit (advisory) ----------------------------------------------
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0363 --ignore RUSTSEC-2024-0421 --ignore RUSTSEC-2026-0041 --ignore RUSTSEC-2026-0044 --ignore RUSTSEC-2026-0045 --ignore RUSTSEC-2026-0046 --ignore RUSTSEC-2026-0047 --ignore RUSTSEC-2026-0048 --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0067 --ignore RUSTSEC-2026-0068

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            hive-app/src-ui/package-lock.json
            entity-runtime-app/src-ui/package-lock.json

      - name: npm audit split frontends
        shell: bash
        run: |
          cd hive-app/src-ui && npm ci && npm audit --audit-level=high
          cd ../../entity-runtime-app/src-ui && npm ci && npm audit --audit-level=high

  # -- CodeQL static analysis -------------------------------------------------
  # Does not block gate when code scanning is not enabled for the repo.
  codeql:
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:javascript-typescript"

  # -- Gate (aggregator) -----------------------------------------------------
  # Requires lint, test, and frontend to succeed. Audit and CodeQL are
  # advisory (warn but don't block). This is the single required status
  # check for branch protection.
  gate:
    needs: [stability, lint, test, frontend, audit, codeql]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Evaluate upstream results
        shell: bash
        run: |
          echo "stability:${{ needs.stability.result }}"
          echo "lint:     ${{ needs.lint.result }}"
          echo "test:     ${{ needs.test.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "audit:    ${{ needs.audit.result }}"
          echo "codeql:   ${{ needs.codeql.result }}"

          failed=false

          # Critical jobs -- must succeed
          for job in stability lint test frontend; do
            case "$job" in
              stability) result="${{ needs.stability.result }}" ;;
              lint)     result="${{ needs.lint.result }}" ;;
              test)     result="${{ needs.test.result }}" ;;
              frontend) result="${{ needs.frontend.result }}" ;;
              *)        result="unknown" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "::error::Required job '$job' did not succeed (result: $result)"
              failed=true
            fi
          done

          # Advisory jobs -- warn but don't block
          for job in audit codeql; do
            case "$job" in
              audit)  result="${{ needs.audit.result }}" ;;
              codeql) result="${{ needs.codeql.result }}" ;;
              *)      result="unknown" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "::warning::Advisory job '$job' did not succeed (result: $result)"
            fi
          done

          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi

          echo "Gate passed -- all required jobs succeeded."
